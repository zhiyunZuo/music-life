<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MUSIC LIFE · 音乐人生 RPG</title>
<!-- 网页字体改为“非阻塞”加载：即使 fonts.googleapis.com 连不上（国内常见），页面也能立刻渲染，不会一直白屏 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" />
<link rel="stylesheet" href="css/style.css" />
<style>
/* 本地字体兜底：Google Fonts 拿不到时用系统宋体/黑体顶上，保证字形不塌 */
:root{
  --font-disp:'Orbitron','Rajdhani','PingFang SC','Microsoft YaHei',"Noto Serif SC",system-ui,serif;
  --font-ui:'Rajdhani','PingFang SC','Microsoft YaHei',"Noto Serif SC",system-ui,sans-serif;
  --font-cn:"Noto Serif SC","Songti SC",'STSong','SimSun',"PingFang SC","Microsoft YaHei",serif;
}
</style>
</head>
<body>
<div id="boot-flash"></div>

<!-- ============ INTRO / 开场动画 ============ -->
<section id="screen-intro" class="screen active">
  <div class="cine" id="cine">
    <div class="cine-aurora a1"></div>
    <div class="cine-aurora a2"></div>

    <div class="cine-core">
      <div class="cine-staff">
        <svg viewBox="0 0 520 140" aria-hidden="true">
          <line class="sl" x1="10" y1="30"  x2="510" y2="30"/>
          <line class="sl" x1="10" y1="55"  x2="510" y2="55"/>
          <line class="sl" x1="10" y1="80"  x2="510" y2="80"/>
          <line class="sl" x1="10" y1="105" x2="510" y2="105"/>
          <line class="sl" x1="10" y1="130" x2="510" y2="130"/>
        </svg>
      </div>
      <div class="cine-note">♪</div>
      <div class="cine-notes">
        <span class="cn n1">♩</span><span class="cn n2">♫</span>
        <span class="cn n3">♬</span><span class="cn n4">♪</span>
      </div>
    </div>

    <div class="cine-titles">
      <div class="cine-kicker">MUSIC · LIFE</div>
      <h1 class="cine-title">音乐人生</h1>
      <div class="cine-rule"></div>
      <p class="cine-sub">不是看课程，而是过一段音乐人生。</p>
      <button id="btn-start" class="cine-btn">开始我的音乐人生</button>
      <div class="cine-tip">轻触任意处跳过动画</div>
    </div>
  </div>
</section>

<!-- ============ MAIN APP ============ -->
<div id="app" class="app" style="display:none">
  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">♪</span>
      <span class="brand-text">MUSIC&nbsp;LIFE</span>
    </div>
    <nav class="topmenu" id="topmenu"></nav>
    <div class="topright">
      <div class="topright-info" id="topright-info"></div>
      <button id="btn-reset" class="mini-btn" title="重置存档">⟳ 重置</button>
    </div>
  </header>

  <!-- Left: character -->
  <aside class="col-left" id="col-left"></aside>

  <!-- Center: view -->
  <main class="col-center" id="view"></main>

  <!-- Bottom nav -->
  <nav class="botnav" id="botnav"></nav>
</div>

<!-- Toast / floating layer -->
<div id="toast-layer"></div>
<div id="modal-layer"></div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/instruments.js"></script>
<script src="js/inst-harp.js"></script>
<script src="js/inst-piano.js"></script>
<script src="js/inst-violin.js"></script>
<script src="js/inst-guitar.js"></script>
<script src="js/inst-sheng.js"></script>
<script src="js/inst-xylophone.js"></script>
<script src="js/inst-marimba.js"></script>
<script src="js/inst-handpan.js"></script>
<script src="js/inst-xiao.js"></script>
<script src="js/inst-flute.js"></script>
<script src="js/inst-cello.js"></script>
<script src="js/inst-voice.js"></script>
<script src="js/world-history.js"></script>
<script src="js/practice.js"></script>
<script src="js/app.js"></script>
<script src="js/diagrams.js"></script>
<script src="js/diagrams-inst.js"></script>
<script src="js/diagram-data.js"></script>
<script src="js/studio-data.js"></script>
<script src="js/glossary.js"></script>
<script src="js/books.js"></script>
<script src="js/readings.js"></script>
<script src="js/learn.js"></script>
<script src="js/quest.js"></script>
<script src="js/arrange.js"></script>
</body>
</html>
